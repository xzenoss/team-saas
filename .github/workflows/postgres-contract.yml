name: Gather PostgreSQL schema contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gather_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gather_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: gather_contract
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Apply schema to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f db/postgres/001_foundation.sql
      - name: Test FK constraints and restricted-role RLS
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres_schema_contract.sql
      - name: Create isolated least-privilege throttle role
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres_auth_throttle_role.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL adapter for disposable integration tests
        run: python -m pip install -r requirements-postgres.txt
      - name: Test shared auth throttle across concurrent processes
        env:
          TEAMSAAS_AUTH_RATE_TEST_DSN: postgresql://gather_throttle_ci:only-for-disposable-ci-tests@localhost:5432/gather_contract
        run: python -m unittest discover -s tests -p 'test_postgres_auth_throttle.py' -v
      - name: Apply PostgreSQL session lifecycle migration
        run: psql -v ON_ERROR_STOP=1 -f db/postgres/002_session_lifecycle.sql
      - name: Create restricted session role
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres_session_role.sql
      - name: Test PostgreSQL session issuance, expiry and cross-process revocation
        env:
          TEAMSAAS_SESSION_TEST_DSN: postgresql://gather_session_ci:disposable-session-test-only@localhost:5432/gather_contract
          TEAMSAAS_SESSION_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/gather_contract
        run: python -m unittest discover -s tests -p 'test_postgres_session_store.py' -v
