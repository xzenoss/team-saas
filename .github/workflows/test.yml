name: Gather security and functional CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile server.py
      - name: Health endpoint import smoke test
        run: |
          python - <<'PY'
          import server
          assert server.MAX_REQUEST_BYTES == 32768
          print("server import OK")
          PY
      - name: Verify tenant isolation, CSRF, origin and demo gates
        run: python -m unittest discover -s tests -v
